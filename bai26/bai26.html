<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bài 26 - Đăng ký câu lạc bộ</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="bai26.css" />
  </head>
  <body class="bg-light">
    <main class="container py-5">
      <div class="card registration-card border-0 shadow mx-auto">
        <div class="card-header bg-success text-white text-center py-3">
          <h1 class="h4 mb-1">Đăng ký CLB Lập trình Web</h1>
          <p class="mb-0">Tham gia cùng chúng mình!</p>
        </div>
        <div class="card-body p-4">
          <form>
            <div class="row g-3">
              <div class="col-12 col-md-6">
                <label class="form-label" for="full-name">Họ và tên</label>
                <input class="form-control" id="full-name" name="full-name" type="text" required />
              </div>
              <div class="col-12 col-md-6">
                <label class="form-label" for="student-id">Mã sinh viên</label>
                <input class="form-control" id="student-id" name="student-id" type="text" required />
              </div>
              <div class="col-12 col-md-6">
                <label class="form-label" for="email">Email</label>
                <input class="form-control" id="email" name="email" type="email" required />
              </div>
              <div class="col-12 col-md-6">
                <label class="form-label" for="phone">Số điện thoại</label>
                <input class="form-control" id="phone" name="phone" type="tel" required />
              </div>
              <fieldset class="col-12">
                <legend class="form-label mb-2">Trình độ hiện tại</legend>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" id="level-basic" name="level" type="radio" value="basic" required />
                  <label class="form-check-label" for="level-basic">Cơ bản</label>
                </div>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" id="level-good" name="level" type="radio" value="good" />
                  <label class="form-check-label" for="level-good">Khá</label>
                </div>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" id="level-best" name="level" type="radio" value="best" />
                  <label class="form-check-label" for="level-best">Tốt</label>
                </div>
              </fieldset>
              <div class="col-12">
                <label class="form-label" for="class-choice">Chọn lớp</label>
                <select class="form-select" id="class-choice" name="class-choice" required>
                  <option value="" selected disabled>Chọn một lớp</option>
                  <option value="html">HTML & CSS cơ bản</option>
                  <option value="javascript">JavaScript nhập môn</option>
                  <option value="bootstrap">Bootstrap thực hành</option>
                </select>
              </div>
              <div class="col-12">
                <div class="form-check">
                  <input class="form-check-input" id="commitment" type="checkbox" required />
                  <label class="form-check-label" for="commitment">
                    Tôi cam kết tham gia và hoàn thành bài tập của câu lạc bộ.
                  </label>
                </div>
              </div>
              <div class="col-12 d-flex justify-content-end gap-2">
                <button class="btn btn-outline-secondary" type="reset">Nhập lại</button>
                <button class="btn btn-success" type="submit">Đăng ký</button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </main>
  </body>
</html>
