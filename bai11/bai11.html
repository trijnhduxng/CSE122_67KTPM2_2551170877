<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bài 11 - Thư viện ảnh Việt Nam</title>
    <link rel="stylesheet" href="bai11.css" />
  </head>
  <body>
    <main class="gallery">
      <header class="gallery-header">
        <h1>Thư viện ảnh Việt Nam</h1>
        <p>
          Bộ sưu tập 6 danh thắng tiêu biểu — minh họa thẻ figure / figcaption.
        </p>
      </header>

      <section class="gallery-grid" aria-label="Sáu danh thắng Việt Nam">
        <figure class="gallery-item">
          <img
            src="../Anh/Bai11/1-vinh-ha-long.jpg"
            alt="Bãi biển và những hàng dừa tại Vịnh Hạ Long"
          />
          <figcaption>Hình 1. Vịnh Hạ Long</figcaption>
        </figure>

        <figure class="gallery-item">
          <img
            src="../Anh/Bai11/2-son-doong.jpg"
            alt="Khung cảnh kỳ vĩ bên trong Hang Sơn Đoòng"
          />
          <figcaption>Hình 2. Hang Sơn Đoòng</figcaption>
        </figure>

        <figure class="gallery-item">
          <img
            src="../Anh/Bai11/3-thac-ban-gioc.jpg"
            alt="Thác nước nhiều tầng giữa núi rừng"
          />
          <figcaption>Hình 3. Thác Bản Giốc</figcaption>
        </figure>

        <figure class="gallery-item">
          <img
            src="../Anh/Bai11/4-fansipan.jpg"
            alt="Dãy núi Fansipan nhìn qua thung lũng"
          />
          <figcaption>Hình 4. Fansipan</figcaption>
        </figure>

        <figure class="gallery-item">
          <img
            src="../Anh/Bai11/5-mekong.jpg"
            alt="Thuyền chở hàng trên sông Cửu Long"
          />
          <figcaption>Hình 5. Đồng bằng sông Cửu Long</figcaption>
        </figure>

        <figure class="gallery-item">
          <img
            src="../Anh/Bai11/6-phong-nha.jpg"
            alt="Nhũ đá bên trong hang động Phong Nha"
          />
          <figcaption>Hình 6. Động Phong Nha</figcaption>
        </figure>
      </section>
    </main>
  </body>
</html>
