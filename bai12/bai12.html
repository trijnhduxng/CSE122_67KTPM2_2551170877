<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bài 12 - In lịch</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="bai12.css" />
    <script src="bai12.js" defer></script>
  </head>
  <body>
    <main class="container py-5">
      <section class="calendar-card card border-0 shadow-lg mx-auto">
        <div class="card-body p-4 p-md-5">
          <div
            class="calendar-display text-center rounded-3 mb-3"
            aria-live="polite"
          >
            <p class="calendar-year mb-0" id="calendar-year"></p>
            <p class="calendar-month mb-0" id="calendar-month"></p>
            <p class="calendar-day mb-0" id="calendar-day"></p>
            <p class="calendar-weekday mb-0" id="calendar-weekday"></p>
          </div>

          <p class="greeting text-center mb-3" id="greeting"></p>

          <form
            class="calendar-form border border-2 rounded-3 p-3"
            id="calendar-form"
            novalidate
          >
            <div class="row g-3 align-items-end">
              <div class="col-4 col-sm-3">
                <label class="form-label" for="day">Ngày</label>
                <input
                  class="form-control text-center"
                  id="day"
                  name="day"
                  type="number"
                  min="1"
                  max="31"
                  required
                />
              </div>

              <div class="col-4 col-sm-3">
                <label class="form-label" for="month">Tháng</label>
                <input
                  class="form-control text-center"
                  id="month"
                  name="month"
                  type="number"
                  min="1"
                  max="12"
                  required
                />
              </div>

              <div class="col-4 col-sm-3">
                <label class="form-label" for="year">Năm</label>
                <input
                  class="form-control text-center"
                  id="year"
                  name="year"
                  type="number"
                  min="1000"
                  max="9999"
                  required
                />
              </div>

              <div class="col-12 col-sm-3">
                <button class="btn btn-secondary w-100" type="submit">
                  In lịch
                </button>
              </div>
            </div>
            <p
              class="error-message text-danger text-center mb-0 mt-3"
              id="error-message"
              role="alert"
            ></p>
          </form>
        </div>
      </section>
    </main>
  </body>
</html>
