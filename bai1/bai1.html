<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="main1.css" />
    <title>Bài 1-Trang thơ "Bốn mùa</title>
  </head>
  <body>
    <div class="container">
      <h1 class="title">BỐN MÙA</h1>
      <p class="poem_1-3">
        Xuân về hoa nở khắp trời<br />
        Hạ sang nắng cháy rạng ngời phố quen<br />
        Thu về lá rụng bên thềm
      </p>
      <hr class="driver" />
      <p class="poem_2">
        Đông sang gió lạnh bên em đợi chờ<br />
        Bốn mùa là bốn giấc mơ<br />
        Thời gian đi mãi ta chờ đợi ai
      </p>
      <hr class="driver" />
      <p class="poem_1-3">
        Một năm rồi lại một năm<br />
        Vẫn còn câu hát thì thầm quê hương<br />
        Chờ xuân nắng mới soi đường
      </p>
      <p>dũng đẹp trai</p>
    </div>
  </body>
</html>
