<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bài 15 - Máy tính đơn giản</title>
    <link rel="stylesheet" href="bai15.css" />
    <script src="bai15.js" defer></script>
  </head>
  <body>
    <main class="calculator">
      <h1>Máy tính</h1>
      <div class="display" aria-live="polite">
        <p class="expression" id="expression"></p>
        <p class="result" id="result">0</p>
      </div>
      <div class="keys" id="keys">
        <button class="clear" data-action="clear">C</button>
        <button data-action="sign">±</button>
        <button class="operator" data-operator="%">%</button>
        <button class="operator" data-operator="÷">÷</button>
        <button data-number="7">7</button>
        <button data-number="8">8</button>
        <button data-number="9">9</button>
        <button class="operator" data-operator="×">×</button>
        <button data-number="4">4</button>
        <button data-number="5">5</button>
        <button data-number="6">6</button>
        <button class="operator" data-operator="−">−</button>
        <button data-number="1">1</button>
        <button data-number="2">2</button>
        <button data-number="3">3</button>
        <button class="operator" data-operator="+">+</button>
        <button class="zero" data-number="0">0</button>
        <button data-action="decimal">.</button>
        <button class="equals" data-action="equals">=</button>
      </div>
    </main>
  </body>
</html>
