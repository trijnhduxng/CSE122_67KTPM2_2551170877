<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bài 13 - Đồng hồ số</title>
    <link rel="stylesheet" href="bai13.css" />
    <script src="bai13.js" defer></script>
  </head>
  <body>
    <main class="clock-page">
      <section class="clock-card" aria-label="Đồng hồ số">
        <div class="clock" id="clock" aria-label="Giờ hiện tại">
          <img data-digit="0" alt="0" />
          <img data-digit="1" alt="0" />
          <img class="separator" src="../Anh/Bai13/haicham.gif" alt=":" />
          <img data-digit="2" alt="0" />
          <img data-digit="3" alt="0" />
          <img class="separator" src="../Anh/Bai13/haicham.gif" alt=":" />
          <img data-digit="4" alt="0" />
          <img data-digit="5" alt="0" />
        </div>
        <p class="greeting" id="greeting" aria-live="polite"></p>
      </section>
    </main>
  </body>
</html>
