<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bài 17 - Kiểm tra biểu mẫu</title>
    <link rel="stylesheet" href="bai17.css" />
    <script src="bai17.js" defer></script>
  </head>
  <body>
    <main class="register-card">
      <h1>Đăng ký tài khoản</h1>
      <form id="register-form" novalidate>
        <div class="field">
          <label for="full-name">Họ và tên</label>
          <input id="full-name" name="full-name" type="text" autocomplete="name" />
          <small class="error" id="full-name-error"></small>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" />
          <small class="error" id="email-error"></small>
        </div>
        <div class="field">
          <label for="password">Mật khẩu</label>
          <input id="password" name="password" type="password" autocomplete="new-password" />
          <small class="error" id="password-error"></small>
        </div>
        <div class="field">
          <label for="confirm-password">Xác nhận mật khẩu</label>
          <input id="confirm-password" name="confirm-password" type="password" autocomplete="new-password" />
          <small class="error" id="confirm-password-error"></small>
        </div>
        <button type="submit">Đăng ký</button>
        <p class="success" id="success-message" aria-live="polite"></p>
      </form>
    </main>
  </body>
</html>
